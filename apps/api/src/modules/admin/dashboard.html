<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPTV Manager — Administration</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #161b22;
        --border: #262d38;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #3b82f6;
        --ok: #3fb950;
        --warn: #d29922;
        --err: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px; background: var(--bg); color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
      .sub { color: var(--muted); margin: 0 0 20px; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
      .stat b { display: block; font-size: 26px; }
      .stat span { color: var(--muted); font-size: 13px; }
      input, button, select {
        font: inherit; background: #0d1117; color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
      }
      button { cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:hover { filter: brightness(1.15); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 14px; }
      th { color: var(--muted); font-weight: 500; }
      .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
      .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      code { background: #0d1117; padding: 3px 7px; border-radius: 6px; font-size: 13px; word-break: break-all; }
      .logo { width: 28px; height: 20px; object-fit: contain; }
      #toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel);
        border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: none; }
    </style>
  </head>
  <body>
    <h1>IPTV Manager</h1>
    <p class="sub">Sources publiques iptv-org — usage privé.</p>

    <div class="panel row">
      <input id="key" type="password" placeholder="Clé API (x-api-key)" style="flex:1;min-width:220px" />
      <button class="primary" onclick="saveKey()">Connecter</button>
      <button onclick="run('/import/run', 'POST')">Relancer l'import</button>
      <button onclick="run('/import/health-check', 'POST')">Vérifier les flux</button>
      <button onclick="run('/admin/curation/apply', 'POST')">Réappliquer la curation</button>
      <button onclick="run('/admin/streams/purge-dead', 'POST')">Purger les flux morts</button>
    </div>

    <h2>Vue d'ensemble</h2>
    <div class="grid" id="stats"></div>

    <h2>Liens à coller dans la TV</h2>
    <div class="panel" id="playlists"></div>

    <h2>Chaînes voulues sans flux public</h2>
    <div class="panel" id="missing"></div>

    <h2>Recherche</h2>
    <div class="panel">
      <div class="row" style="margin-bottom:12px">
        <input id="q" placeholder="tf1, rti, ivoire, documentaire…" style="flex:1" onkeydown="if(event.key==='Enter')search()" />
        <button class="primary" onclick="search()">Chercher</button>
      </div>
      <div id="results"></div>
    </div>

    <div id="toast"></div>

    <script>
      const API = location.pathname.replace(/\/admin\/?$/, '');
      let key = localStorage.getItem('iptv-key') || '';
      document.getElementById('key').value = key;

      function saveKey() {
        key = document.getElementById('key').value.trim();
        localStorage.setItem('iptv-key', key);
        load();
      }

      function toast(message, isError) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.style.display = 'block';
        el.style.borderColor = isError ? 'var(--err)' : 'var(--border)';
        setTimeout(() => (el.style.display = 'none'), 4000);
      }

      async function api(path, method = 'GET', body) {
        const response = await fetch(API + path, {
          method,
          headers: {
            ...(key ? { 'x-api-key': key } : {}),
            ...(body ? { 'content-type': 'application/json' } : {}),
          },
          ...(body ? { body: JSON.stringify(body) } : {}),
        });
        if (!response.ok) throw new Error((await response.text()).slice(0, 200));
        return response.json();
      }

      async function run(path, method, body) {
        try {
          const result = await api(path, method, body);
          toast(JSON.stringify(result).slice(0, 160));
          setTimeout(load, 1500);
        } catch (error) {
          toast(error.message, true);
        }
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c]);
      }

      async function load() {
        try {
          const data = await api('/admin/dashboard');
          const s = data.stats;
          document.getElementById('stats').innerHTML = [
            ['Chaînes', s.channels.total],
            ['Avec flux actif', s.channels.active],
            ['Mes chaînes', s.channels.wanted],
            ['Favoris', s.favorites],
            ['Flux', s.streams],
            ['Flux morts', s.deadStreams],
          ].map(([label, value]) =>
            `<div class="panel stat"><b>${value}</b><span>${label}</span></div>`).join('');

          document.getElementById('playlists').innerHTML =
            '<table><tr><th>Playlist</th><th>Chaînes</th><th>Lien M3U</th></tr>' +
            data.playlists.map((p) =>
              `<tr><td>${escapeHtml(p.name)}</td><td>${p.channelCount}</td>
               <td><code>${escapeHtml(p.m3uUrl)}</code>
               <button onclick="navigator.clipboard.writeText('${escapeHtml(p.m3uUrl)}');toast('Lien copié')">copier</button></td></tr>`).join('') +
            '</table>';

          const missing = data.curation.missing;
          document.getElementById('missing').innerHTML = missing.length === 0
            ? '<p class="ok">Toutes les chaînes voulues ont un flux public.</p>'
            : '<table><tr><th>Chaîne</th><th>Groupe</th><th>État</th></tr>' +
              missing.map((m) =>
                `<tr><td>${escapeHtml(m.label)}</td><td>${escapeHtml(m.group)}</td>
                 <td class="${m.status === 'NO_PUBLIC_STREAM' ? 'warn' : 'err'}">${m.status}</td></tr>`).join('') +
              '</table><p class="sub">Aucune source non autorisée n\'est recherchée : ces chaînes seront reprises automatiquement dès qu\'un flux public existera.</p>';
        } catch (error) {
          toast('Connexion impossible : ' + error.message, true);
        }
      }

      async function search() {
        const q = document.getElementById('q').value.trim();
        try {
          const data = await api('/channels/search?limit=40&active=false&q=' + encodeURIComponent(q));
          document.getElementById('results').innerHTML =
            '<table><tr><th></th><th>Nom</th><th>Pays</th><th>Qualité</th><th>État</th><th>Actions</th></tr>' +
            data.data.map((c) =>
              `<tr>
                 <td>${c.logo ? `<img class="logo" src="${escapeHtml(c.logo)}" onerror="this.remove()"/>` : ''}</td>
                 <td>${escapeHtml(c.name)}${c.isWanted ? ' <span class="tag ok">curée</span>' : ''}</td>
                 <td>${escapeHtml(c.countryCode || '')}</td>
                 <td>${escapeHtml(c.streamQuality || '')}</td>
                 <td class="${c.isActive ? 'ok' : 'err'}">${c.isActive ? 'actif' : 'sans flux'}</td>
                 <td class="row">
                   <button onclick="run('/admin/channels/${c.slug}/test','POST')">tester</button>
                   <button onclick="run('/favorites','POST',{channelId:'${c.slug}'})">favori</button>
                 </td>
               </tr>`).join('') +
            `</table><p class="sub">${data.meta.total} résultat(s)</p>`;
        } catch (error) {
          toast(error.message, true);
        }
      }

      load();
    </script>
  </body>
</html>
